<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B90B" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1424" />
      <stop offset="1" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070B14" stop-opacity="0" />
      <stop offset="1" stop-color="#070B14" stop-opacity="0.92" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#F0B90B" stroke-width="2" />
    </marker>
    <marker id="arrowMut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8A99B8" stroke-width="2" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#F0616D" stroke-width="2" />
    </marker>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#fieldGrad)" />
  <g id="grid" data-pptx-role="decoration" data-pptx-bounds="0 0 1280 720" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.055">
    <line x1="0" y1="0" x2="0" y2="720" />
    <line x1="80" y1="0" x2="80" y2="720" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="240" y1="0" x2="240" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="400" y1="0" x2="400" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="560" y1="0" x2="560" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="720" y1="0" x2="720" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="880" y1="0" x2="880" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1040" y1="0" x2="1040" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
    <line x1="1200" y1="0" x2="1200" y2="720" />
    <line x1="1280" y1="0" x2="1280" y2="720" />
    <line x1="0" y1="0" x2="1280" y2="0" />
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="0" y1="640" x2="1280" y2="640" />
    <line x1="0" y1="720" x2="1280" y2="720" />
  </g>
  <g id="pagehead" data-pptx-bounds="72 40 900 96">
  <text id="kicker" x="72" y="62" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" letter-spacing="3" fill="#F0B90B">THE DISTINCTION THAT MATTERS</text>
  <text id="ptitle" x="72" y="104" font-size="40" font-weight="bold" fill="#EAF0FB">建议 vs 强制</text>
  <rect id="trule" x="72" y="124" width="120" height="4" fill="url(#goldGrad)" />
  </g>
  <g id="adv" data-pptx-bounds="72 160 548 440">
    <rect x="72" y="160" width="548" height="440" rx="10" fill="#0D1424" stroke="#F0616D" stroke-width="1" stroke-opacity="0.45" />
    <rect x="72" y="160" width="548" height="52" rx="10" fill="#F0616D" fill-opacity="0.12" />
    <text x="104" y="194" font-size="21" font-weight="bold" fill="#F0616D">✕ 建议模式 —— 大多数风控 Agent 止步于此</text>
    <text x="104" y="266" font-family="Consolas, Microsoft YaHei, monospace" font-size="17" fill="#EAF0FB">代理 ──▶ Aegis</text>
    <text x="104" y="298" font-family="Consolas, Microsoft YaHei, monospace" font-size="17" fill="#8A99B8">    └──▶ 币安 MCP</text>
    <line x1="104" y1="330" x2="588" y2="330" stroke="#22304C" stroke-width="1" />
    <text x="104" y="368" font-size="18" fill="#8A99B8">代理同时持有币安写入工具和 Aegis 工具,<tspan x="104" dy="30">靠系统提示词要求「先问 Aegis」。</tspan></text>
    <rect x="104" y="428" width="484" height="46" rx="4" fill="#F0616D" fill-opacity="0.10" />
    <text x="124" y="458" font-size="20" font-weight="bold" fill="#F0616D">这是建议,不是强制。</text>
    <text x="104" y="510" font-size="17" fill="#8A99B8">被提示注入或有 bug 的代理可以直接调用币安,<tspan x="104" dy="28">Aegis 永远看不到那笔订单。</tspan></text>
  </g>
  <g id="gw" data-pptx-bounds="660 160 548 440">
    <rect x="660" y="160" width="548" height="440" rx="10" fill="#0D1424" stroke="#34D399" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="660" y="160" width="548" height="52" rx="10" fill="#34D399" fill-opacity="0.12" />
    <text x="692" y="194" font-size="21" font-weight="bold" fill="#34D399">✓ 网关模式 —— Aegis v2</text>
    <text x="692" y="272" font-family="Consolas, Microsoft YaHei, monospace" font-size="17" fill="#EAF0FB">代理 ──▶ Aegis ──▶ 币安</text>
    <line x1="692" y1="330" x2="1176" y2="330" stroke="#22304C" stroke-width="1" />
    <text x="692" y="368" font-size="18" fill="#8A99B8">代理完全没有币安写入工具。</text>
    <text x="692" y="398" font-size="18" fill="#8A99B8">Aegis 持有凭证,只暴露一个执行工具。</text>
    <rect x="692" y="428" width="484" height="46" rx="4" fill="#34D399" fill-opacity="0.10" />
    <text x="712" y="458" font-size="20" font-weight="bold" fill="#34D399">保证成为部署本身的性质。</text>
    <text x="692" y="510" font-size="17" fill="#8A99B8">没有第二条路径 —— 因为从未给过它。</text>
    <text x="692" y="546" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" fill="#F0B90B">aegis mcp --gateway</text>
  </g>
  <g id="pagefoot" data-pptx-role="footer" data-pptx-bounds="72 650 1136 46">
  <line id="frule" x1="72" y1="662" x2="1208" y2="662" stroke="#22304C" stroke-width="1" />
  <text id="fbrand" x="72" y="688" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" fill="#8A99B8">AEGIS · Binance Agent OS Mini Hackathon · Track A</text>
  <text id="fnum" data-pptx-role="page-number" x="1208" y="688" text-anchor="end" font-family="Consolas, Microsoft YaHei, monospace" font-size="13" fill="#F0B90B">03</text>
  </g>
