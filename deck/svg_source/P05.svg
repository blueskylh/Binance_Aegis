  <g id="pagehead" data-pptx-bounds="72 40 900 96">
  <text id="kicker" x="72" y="62" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" letter-spacing="3" fill="#F0B90B">INVARIANTS</text>
  <text id="ptitle" x="72" y="104" font-size="40" font-weight="bold" fill="#EAF0FB">三条被代码强制的不变量</text>
  <rect id="trule" x="72" y="124" width="120" height="4" fill="url(#goldGrad)" />
  </g>
  <g id="inv1" data-pptx-bounds="72 168 368 432">
    <rect x="72" y="168" width="368" height="432" rx="10" fill="#0D1424" stroke="#22304C" stroke-width="1" />
    <rect x="72" y="168" width="368" height="5" fill="#34D399" />
    <text x="372" y="252" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="72" font-weight="bold" fill="#34D399" fill-opacity="0.16">1</text>
    <circle cx="112" cy="222" r="18" fill="#34D399" fill-opacity="0.16" />
    <text x="112" y="229" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" font-weight="bold" fill="#34D399">1</text>
    <text x="104" y="298" font-size="23" font-weight="bold" fill="#EAF0FB">平仓永不被拦</text>
    <line x1="104" y1="318" x2="408" y2="318" stroke="#22304C" stroke-width="1" />
    <text x="104" y="356" font-size="16" fill="#8A99B8">每一个熔断器 —— 总闸、日亏、回撤、<tspan x="104" dy="30">冷静期、限速、单笔上限、复核阈值</tspan><tspan x="104" dy="30">—— 都会为经过验证的降险操作让路。</tspan></text>
    <text x="104" y="476" font-size="16" fill="#8A99B8">一个会把你困在仓位里的风控系统,<tspan x="104" dy="30">本身就是风险。</tspan></text>
  </g>
  <g id="inv2" data-pptx-bounds="456 168 368 432">
    <rect x="456" y="168" width="368" height="432" rx="10" fill="#0D1424" stroke="#22304C" stroke-width="1" />
    <rect x="456" y="168" width="368" height="5" fill="#22D3EE" />
    <text x="756" y="252" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="72" font-weight="bold" fill="#22D3EE" fill-opacity="0.16">2</text>
    <circle cx="496" cy="222" r="18" fill="#22D3EE" fill-opacity="0.16" />
    <text x="496" y="229" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" font-weight="bold" fill="#22D3EE">2</text>
    <text x="488" y="298" font-size="23" font-weight="bold" fill="#EAF0FB">声明是证据,不是证明</text>
    <line x1="488" y1="318" x2="792" y2="318" stroke="#22304C" stroke-width="1" />
    <text x="488" y="356" font-size="16" fill="#8A99B8">reduceOnly 会与真实仓位核对:<tspan x="488" dy="30">方向必须相反、规模不得超出、</tspan><tspan x="488" dy="30">快照必须足够新鲜。</tspan></text>
    <text x="488" y="476" font-size="16" fill="#8A99B8">无法验证时拒绝豁免,<tspan x="488" dy="30">而不是猜测。</tspan></text>
  </g>
  <g id="inv3" data-pptx-bounds="840 168 368 432">
    <rect x="840" y="168" width="368" height="432" rx="10" fill="#0D1424" stroke="#22304C" stroke-width="1" />
    <rect x="840" y="168" width="368" height="5" fill="#F0B90B" />
    <text x="1140" y="252" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="72" font-weight="bold" fill="#F0B90B" fill-opacity="0.16">3</text>
    <circle cx="880" cy="222" r="18" fill="#F0B90B" fill-opacity="0.16" />
    <text x="880" y="229" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" font-weight="bold" fill="#F0B90B">3</text>
    <text x="872" y="298" font-size="23" font-weight="bold" fill="#EAF0FB">永远 fail closed</text>
    <line x1="872" y1="318" x2="1176" y2="318" stroke="#22304C" stroke-width="1" />
    <text x="872" y="356" font-size="16" fill="#8A99B8">畸形动作、坏策略文件、未知字段、<tspan x="872" dy="30">未支持 venue、未成交订单、</tspan><tspan x="872" dy="30">规则自身抛异常 —— 一律 deny。</tspan></text>
    <text x="872" y="476" font-size="16" fill="#8A99B8">绝不会意外产生 allow。</text>
  </g>
  <g id="pagefoot" data-pptx-role="footer" data-pptx-bounds="72 650 1136 46">
