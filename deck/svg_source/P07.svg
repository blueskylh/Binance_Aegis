    <rect x="72" y="372" width="548" height="228" rx="10" fill="#F0616D" fill-opacity="0.07" stroke="#F0616D" stroke-width="1" stroke-opacity="0.45" />
    <text x="104" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" fill="#F0616D">篡改被当场检出</text>
    <text x="104" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#8A99B8">Demo 主动把一条历史 DENY 改写成 ALLOW ——<tspan x="104" dy="28">正是攻击者会做的事。</tspan></text>
    <rect x="104" y="500" width="484" height="72" rx="6" fill="#070B14" fill-opacity="0.6" />
