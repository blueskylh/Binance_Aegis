    <text x="692" y="414" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="bold" fill="#22D3EE">诚实的威胁模型</text>
    <text x="692" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#8A99B8">无密钥模式是<tspan fill="#EAF0FB">防篡改可检测</tspan>,而非不可篡改。</text>
    <text x="692" y="482" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#8A99B8">有写权限且懂算法的攻击者可以重算整条链。</text>
    <line x1="692" y1="504" x2="1176" y2="504" stroke="#22304C" stroke-width="1" />
    <text x="692" y="536" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" fill="#8A99B8">设置 <tspan font-family="Consolas, Microsoft YaHei, monospace" fill="#F0B90B">AEGIS_LEDGER_KEY</tspan> 启用 HMAC 模式,</text>
