  <g id="pagehead" data-pptx-bounds="72 40 900 96">
  <text id="kicker" x="72" y="62" font-family="Consolas, Microsoft YaHei, monospace" font-size="15" letter-spacing="3" fill="#F0B90B">THE GAP</text>
  <text id="ptitle" x="72" y="104" font-size="40" font-weight="bold" fill="#EAF0FB">被留给用户的那一层</text>
  <rect id="trule" x="72" y="124" width="120" height="4" fill="url(#goldGrad)" />
  </g>
  <g id="quote" data-pptx-bounds="72 156 720 234">
    <rect x="72" y="168" width="720" height="210" rx="8" fill="#F0B90B" fill-opacity="0.07" />
    <rect x="72" y="168" width="4" height="210" fill="#F0B90B" />
    <text x="112" y="222" font-size="66" font-weight="bold" fill="#F0B90B" fill-opacity="0.35">“</text>
    <text x="112" y="272" font-size="25" fill="#EAF0FB">币安现在允许 AI 代理进行交易,</text>
    <text x="112" y="312" font-size="25" font-weight="bold" fill="#F0B90B">但管住它们这件事,基本上要靠用户自己。</text>
    <text x="112" y="352" font-family="Consolas, Microsoft YaHei, monospace" font-size="14" fill="#8A99B8">— TechCrunch,2026 年 8 月 20 日</text>
  </g>
  <g id="questions" data-pptx-bounds="832 168 380 224">
  <text id="q1" x="856" y="196" font-size="19" fill="#8A99B8">谁限制金额?</text>
  <text id="q2" x="856" y="242" font-size="19" fill="#8A99B8">谁限制频率?</text>
  <text id="q3" x="856" y="288" font-size="19" fill="#8A99B8">谁限制杠杆?</text>
  <text id="q4" x="856" y="334" font-size="19" fill="#8A99B8">谁阻止失控循环?</text>
  <text id="q5" x="856" y="380" font-size="19" fill="#8A99B8">谁做审计?</text>
  <line id="qrule" x1="832" y1="176" x2="832" y2="392" stroke="#22304C" stroke-width="1" />
  </g>
  <g id="verdict" data-pptx-bounds="72 424 1136 176">
    <rect x="72" y="424" width="1136" height="176" rx="8" fill="#111A2E" stroke="#22304C" stroke-width="1" />
    <text x="112" y="474" font-size="24" fill="#EAF0FB">币安把<tspan font-weight="bold" fill="#22D3EE">执行轨道</tspan>造得很出色 —— MCP 服务器、binance-cli、Agentic 子账户、执行前确认。</text>
    <text x="112" y="516" font-size="24" fill="#EAF0FB">它有意留给用户的,是<tspan font-weight="bold" fill="#F0B90B">策略与风控层</tspan>。而今天这一层住在系统提示词里。</text>
    <rect x="112" y="540" width="600" height="40" rx="4" fill="#F0616D" fill-opacity="0.10" />
    <text x="132" y="567" font-size="21" font-weight="bold" fill="#F0616D">而系统提示词不是风控措施。</text>
  </g>
  <g id="pagefoot" data-pptx-role="footer" data-pptx-bounds="72 650 1136 46">
