name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (build tooling only — Aegis has zero runtime dependencies)
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Unit + end-to-end tests
        run: node --test "dist/test/**/*.test.js"

      - name: Demo must hold every invariant (exits non-zero if any is violated)
        run: node dist/src/demo/scenario.js

      - name: Security regression suite must pass on its own
        run: node --test dist/test/security.test.js

      - name: Execution gateway suite must pass on its own
        run: node --test dist/test/gateway.test.js

      - name: Exit-code contract — review MUST be non-zero
        run: |
          export AEGIS_HOME="$(mktemp -d)"
          P=policies/conservative.yaml
          node dist/src/cli/main.js -p $P account --equity 10000 --mark BTCUSDT=100000 > /dev/null
          set +e
          node dist/src/cli/main.js -p $P check --category trade --venue spot \
            --symbol BTCUSDT --side BUY --quoteQuantity 150 > /dev/null 2>&1
          CODE=$?
          set -e
          echo "review exit code: $CODE"
          test "$CODE" -eq 3

      - name: All 21 rules are registered
        run: |
          COUNT=$(node dist/src/cli/main.js --json rules | node -p "JSON.parse(require('fs').readFileSync(0)).length")
          echo "rules: $COUNT"
          test "$COUNT" -eq 21

      - name: Every shipped policy must validate
        run: |
          for f in policies/*.yaml; do
            node dist/src/cli/main.js policy validate "$f"
          done

      - name: Ledger verification round-trip
        run: |
          export AEGIS_HOME="$(mktemp -d)"
          node dist/src/cli/main.js -p policies/balanced.yaml check \
            '{"category":"read","venue":"market-data","symbol":"BTCUSDT"}'
          node dist/src/cli/main.js ledger verify

      - name: Confirm zero runtime dependencies
        run: |
          DEPS=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "runtime dependencies: $DEPS"
          test "$DEPS" -eq 0

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tests run inside the build stage)
        run: docker build -t aegis:ci .
      - name: Run the demo from the image
        run: docker run --rm aegis:ci demo
