name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (build tooling only — Aegis has zero runtime dependencies)
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Unit + end-to-end tests
        run: node --test "dist/test/**/*.test.js"

      - name: Demo must hold every invariant (exits non-zero if any is violated)
        run: node dist/src/demo/scenario.js

      - name: Security regression suite must pass on its own
        run: node --test dist/test/security.test.js

      - name: Execution gateway suites must pass on their own
        run: |
          node --test dist/test/gateway.test.js
          node --test dist/test/gateway-hardening.test.js
          node --test dist/test/self-audit.test.js
          node --test dist/test/sizing.test.js

      - name: FINAL GATE — judged action must equal wire action
        run: node --test dist/test/final-gate.test.js

      - name: Unsupported venues must be refused, never rerouted
        run: |
          export AEGIS_HOME="$(mktemp -d)"
          P=policies/balanced.yaml
          node dist/src/cli/main.js -p $P account --equity 10000 --mark BTCUSDT=100000 > /dev/null
          set +e
          node dist/src/cli/main.js -p $P execute --live --category trade --venue margin \
            --symbol BTCUSDT --side BUY --quoteQuantity 100 > /tmp/out.txt 2>&1
          set -e
          grep -q "BLOCKED" /tmp/out.txt

      - name: Version is consistent across package, CLI and skill
        run: |
          PKG=$(node -p "require('./package.json').version")
          CLI=$(node dist/src/cli/main.js --version)
          echo "package=$PKG cli=$CLI"
          test "$PKG" = "$CLI"
          grep -q "version: $PKG" skill/*/SKILL.md

      - name: Exit-code contract — review MUST be non-zero
        run: |
          export AEGIS_HOME="$(mktemp -d)"
          P=policies/conservative.yaml
          node dist/src/cli/main.js -p $P account --equity 10000 --mark BTCUSDT=100000 > /dev/null
          set +e
          node dist/src/cli/main.js -p $P check --category trade --venue spot \
            --symbol BTCUSDT --side BUY --quoteQuantity 150 > /dev/null 2>&1
          CODE=$?
          set -e
          echo "review exit code: $CODE"
          test "$CODE" -eq 3

      - name: Built-in default policy must enable every mandatory guard
        run: |
          node --input-type=module -e "
            import { DEFAULT_POLICY_YAML } from './dist/src/aegis.js';
            import { loadPolicyFromString } from './dist/src/policy/schema.js';
            const p = loadPolicyFromString(DEFAULT_POLICY_YAML);
            if (p.limits.maxPositionSnapshotAgeSec === null) { console.error('default policy: maxPositionSnapshotAgeSec unset'); process.exit(1); }
            if (p.guards.maxStopDistancePct === null) { console.error('default policy: maxStopDistancePct unset'); process.exit(1); }
            console.log('default policy enables every mandatory guard');
          "

      - name: Gateway capabilities must match what dispatch implements
        run: |
          node --input-type=module -e "
            import { GATEWAY_CAPABILITIES } from './dist/src/gateway/capabilities.js';
            const claimed = GATEWAY_CAPABILITIES.map(c => c.category + ':' + c.venue).sort().join(',');
            if (claimed !== 'trade:futures-usds,trade:spot') { console.error('capabilities drifted: ' + claimed); process.exit(1); }
            console.log('capabilities: ' + claimed);
          "

      - name: All 23 rules are registered
        run: |
          COUNT=$(node dist/src/cli/main.js --json rules | node -p "JSON.parse(require('fs').readFileSync(0)).length")
          echo "rules: $COUNT"
          test "$COUNT" -eq 23

      - name: Every shipped policy must validate AND enable the new guards
        run: |
          for f in policies/*.yaml; do
            node dist/src/cli/main.js policy validate "$f"
            grep -q maxPositionSnapshotAgeSec "$f" || { echo "$f missing maxPositionSnapshotAgeSec"; exit 1; }
            grep -q maxStopDistancePct "$f"      || { echo "$f missing maxStopDistancePct"; exit 1; }
          done

      - name: Ledger verification round-trip
        run: |
          export AEGIS_HOME="$(mktemp -d)"
          node dist/src/cli/main.js -p policies/balanced.yaml check \
            '{"category":"read","venue":"market-data","symbol":"BTCUSDT"}'
          node dist/src/cli/main.js ledger verify

      - name: Documentation numbers must match the code
        run: |
          TESTS=$(node --test "dist/test/**/*.test.js" 2>&1 | grep -oP '^# tests \K\d+')
          RULES=$(node --input-type=module -e "import {RULES} from './dist/src/core/rules/index.js'; console.log(RULES.length)")
          echo "code says: $TESTS tests, $RULES rules"
          FAIL=0
          for f in README.md README.en.md docs/*.md skill/*/SKILL.md; do
            # any "<n> tests" or "<n> 个测试" that is not the real count is stale
            BAD=$(grep -oE '[0-9]+ (tests|个测试)' "$f" 2>/dev/null | grep -vE "^($TESTS) " || true)
            if [ -n "$BAD" ]; then echo "::error file=$f::stale test count: $BAD"; FAIL=1; fi
            BADR=$(grep -oE '[0-9]+ (deterministic rules|条确定性规则)' "$f" 2>/dev/null | grep -vE "^($RULES) " || true)
            if [ -n "$BADR" ]; then echo "::error file=$f::stale rule count: $BADR"; FAIL=1; fi
          done
          exit $FAIL

      - name: Confirm zero runtime dependencies
        run: |
          DEPS=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          echo "runtime dependencies: $DEPS"
          test "$DEPS" -eq 0

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (tests run inside the build stage)
        run: docker build -t aegis:ci .
      - name: Run the demo from the image
        run: docker run --rm aegis:ci demo
